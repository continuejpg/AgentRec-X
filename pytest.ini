[pytest]
# The sandbox exports OMP_NUM_THREADS=0, which libgomp rejects on every torch
# import. It is normalised in conftest.py (no extra dependency needed).
# The sandbox has no usable CUDA device, so the pinned PyTorch build emits a one-off
# "CUDA initialization" UserWarning the first time autograd runs; that is an
# environment artifact, not a project issue.
filterwarnings =
    ignore:CUDA initialization:UserWarning
    ignore:.*CUDA initialization.*:UserWarning
    ignore:The \.grad attribute of a Tensor that is not a leaf Tensor:UserWarning
    # Starlette 1.6 deprecates its httpx-based TestClient in favour of httpx2. The
    # tests work correctly; this is a third-party notice we cannot fix in our code.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
